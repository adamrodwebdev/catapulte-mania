# Contrôle qualité automatique.
# Se lance à chaque envoi (push) sur GitHub et à chaque pull request.
# Résultats : onglet « Actions » du dépôt (coche verte = tout va bien).
name: Qualité

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Tests, build et démo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Tests automatiques
        run: npm test
      - name: Style du code
        run: npm run lint
      - name: Build de la version complète
        run: npm run build
      - name: Build de la démo (fichier unique)
        run: npm run build:demo
      - name: Conserver la version complète
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
      - name: Conserver la démo
        uses: actions/upload-artifact@v4
        with:
          name: demo
          path: dist-demo/index.html

  lighthouse:
    name: Lighthouse (minimum 95)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - name: Audit Lighthouse (mobile, 3 passages)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  # Depuis la v6.2 (châteaux assemblés), les 100 niveaux d'un seul tenant dépassaient
  # deux heures : le contrôle était annulé à chaque fois sans rien prouver. Ils passent
  # en dix lots de 10, en parallèle ; le dernier job résume leur verdict. Des lots de 20
  # ne suffisaient pas : ceux de 21 à 100 finissaient en 90 min pile et étaient annulés.
  levels:
    name: Niveaux ${{ matrix.levels }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        levels: ['1-10', '11-20', '21-30', '31-40', '41-50', '51-60', '61-70', '71-80', '81-90', '91-100']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/check-levels.mjs --levels ${{ matrix.levels }}

  levels-all:
    name: Les 100 niveaux sont gagnables
    needs: levels
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verdict des dix lots
        env:
          RESULT: ${{ needs.levels.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "Un lot de niveaux a échoué ou n'a pas fini (résultat : $RESULT)."
            exit 1
          fi
          echo "Les 100 niveaux sont gagnables."
